# ============================================================
# RAJSHIVA STUDIO — Content Manager config
#
# This tells the admin panel what content lives in the repo and
# what forms to show. You rarely need to touch this file.
# ============================================================

backend:
  name: github
  repo: princeraj3377/rajshivastudio   # your GitHub repo
  branch: main

# For testing on your own Mac: run `npx decap-server` in the project
# folder, then open http://localhost:8000/rajshivastudio/admin/ —
# it edits your local files with NO login needed. Comment this out
# (or it is ignored automatically) once you use the live panel.
local_backend: true

# Uploaded images are committed here in the repo…
media_folder: "blog-images"
# …and referenced in posts using this path (Jekyll adds /rajshivastudio)
public_folder: "/blog-images"

# The site name shown in the panel, and where "View live" links go
site_url: https://princeraj3377.github.io/rajshivastudio/
display_url: https://princeraj3377.github.io/rajshivastudio/
logo_url: https://princeraj3377.github.io/rajshivastudio/logo.jpg

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    description: "Write and edit articles. Publish adds a file to _posts and commits it."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}/"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The headline. Include what people would search for." }
      - { label: "Short description", name: "description", widget: "text", hint: "One or two lines — shown on the blog card and in Google results." }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "e.g. capcut, tutorial, shorts" }
      - { label: "Cover image", name: "image", widget: "image", required: false, hint: "Optional. Falls back to your logo if empty." }
      - { label: "Article body", name: "body", widget: "markdown", hint: "Write the post here. Use the toolbar for headings, bold, links and images." }
