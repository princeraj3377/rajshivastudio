# ============================================================
# RAJSHIVA STUDIO — Pages CMS config
#
# This powers the admin panel at https://app.pagescms.org
# It is a dotfile, so Jekyll ignores it and it can never break
# the site build. Log in there with GitHub to manage your blog.
# ============================================================

media:
  - name: images
    label: Blog Images
    input: blog-images
    output: /blog-images
    extensions: [jpg, jpeg, png, gif, webp, svg]

content:
  - name: portfolio
    label: Portfolio Videos
    type: file
    path: _data/portfolio.yml
    fields:
      - name: videos
        label: Videos
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            options:
              required: true
          - name: category
            label: Category
            type: select
            options:
              values: [youtube, shorts, social, podcast, gaming, cinematic, commercial]
          - name: tag
            label: Tag (small label on thumbnail)
            type: string
          - name: link
            label: Video URL (YouTube / Shorts / Instagram)
            type: string
            options:
              required: true
          - name: youtube_id
            label: YouTube ID (for thumbnail)
            type: string
            description: Code after v= or /shorts/. Leave empty for Instagram.
          - name: image
            label: Cover image (Instagram only)
            type: image
          - name: description
            label: Description
            type: text

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        options:
          required: true
      - name: description
        label: Short description
        type: text
        description: One or two lines — shown on the blog card and in Google results.
      - name: date
        label: Publish date
        type: date
        options:
          required: true
      - name: tags
        label: Tags
        type: string
        list: true
        description: e.g. capcut, tutorial, shorts
      - name: image
        label: Cover image
        type: image
        description: Optional — falls back to your logo if empty.
      - name: body
        label: Article body
        type: rich-text
        options:
          required: true

  # ---------- RESOURCES SECTION (separate group) ----------
  - name: res_prompts
    label: "Resources · AI Prompts"
    type: file
    path: _data/prompts.yml
    fields:
      - name: prompts
        label: Prompts
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            options: { required: true }
          - name: type
            label: Badge (Image / Script / Video)
            type: string
          - name: text
            label: Prompt text (Copy button copies this)
            type: text
            options: { required: true }
          - name: image
            label: Preview image (optional)
            type: image

  - name: res_sounds
    label: "Resources · Sound & Music"
    type: file
    path: _data/sounds.yml
    fields:
      - name: items
        label: Sound / Music Packs
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            options: { required: true }
          - name: description
            label: Description
            type: text
          - name: size
            label: Size / count (e.g. 24 files)
            type: string
          - name: link
            label: Download link (Google Drive)
            type: string

  - name: res_presets
    label: "Resources · LUTs & Presets"
    type: file
    path: _data/presets.yml
    fields:
      - name: items
        label: LUTs / Presets / Templates
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            options: { required: true }
          - name: description
            label: Description
            type: text
          - name: size
            label: File type (e.g. .cube, .aep)
            type: string
          - name: link
            label: Download link (Google Drive)
            type: string

  - name: res_tools
    label: "Resources · Tools"
    type: file
    path: _data/tools.yml
    fields:
      - name: tools
        label: Tools & Links
        type: object
        list: true
        fields:
          - name: name
            label: Tool name
            type: string
            options: { required: true }
          - name: url
            label: Website URL
            type: string
          - name: description
            label: Description
            type: text
